<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎫</text></svg>" />

    <!-- viewport-fit=cover: Android'da tirqishli/burchakli ekranlarda kontent
         tizim panellari ostiga kirib ketmasligi uchun (safe-area-inset-*
         index.css'da ishlatiladi). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Android Chrome'da manzil satri va vazifalar ro'yxatidagi rang. -->
    <meta name="theme-color" content="#141413" />
    <meta name="color-scheme" content="light" />

    <!-- "Bosh ekranga qo'shish" orqali ochilganda to'liq ekran (standalone) rejimida
         ishlashi uchun — Android Chrome/Samsung Internet buni qo'llab-quvvatlaydi. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Til sayohati" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- Telefon raqami/manzil kabi matnlarni brauzer avtomatik havolaga
         aylantirib qo'ymasligi uchun (ba'zi Android brauzerlarida uchraydi). -->
    <meta name="format-detection" content="telephone=no" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Til sayohati</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

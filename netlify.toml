# Netlify sozlamasi (repo ildizida). Netlify'da faqat Site settings → Environment variables ga
# 2 ta o'zgaruvchini qo'shing:  VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
[build]
  base    = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Kurs kontenti: brauzer har safar ETag bilan tekshiradi (yangilansa darhol ko'rinadi)
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Vite build'dagi fayllar nomida hash bor — uzoq muddat keshlash xavfsiz
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker va manifest har safar yangidan tekshiriladi (yangi versiya telefonga tez yetib borsin)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Ixtiyoriy Android ilova fayli (frontend/public/til-sayohati.apk) — yuklab olinadigan fayl sifatida beriladi
[[headers]]
  for = "/til-sayohati.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"til-sayohati.apk\""
    Cache-Control = "no-cache"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=()"

# React Router (SPA): barcha yo'llar index.html ga yo'naltiriladi
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
